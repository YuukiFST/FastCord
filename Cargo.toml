[workspace]
resolver = "2"
members = [
    "crates/fastcord-app",
    "crates/fastcord-discord",
    "crates/fastcord-voice",
    "crates/fastcord-media",
    "crates/fastcord-storage",
    "crates/fastcord-platform",
]

[workspace.package]
edition = "2021"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "sync", "io-std", "io-util"] }
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 1
