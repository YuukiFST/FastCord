[package]
name = "gateway-capture-spike"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.23.1"
flate2 = "1.1.10"
futures-util = "0.3.34"
qrcode = "0.14.1"
rand = "0.8"
regex = "1.13.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rsa = "0.9.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "sync", "io-std", "io-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
zeroize = "1.9.0"
